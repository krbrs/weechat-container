name: Build arm64 images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        distro: [ debian, alpine ]
        variant: [ full, slim ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.distro }}
          file: ./${{ matrix.distro }}/Containerfile
          platforms: linux/arm64
          push: true
          build-args: |
            VERSION=latest
            SLIM=${{ matrix.variant == 'slim' && '1' || '0' }}
          tags: |
            ghcr.io/krbrs/weechat-container:latest-${{ matrix.distro }}${{ matrix.variant == 'slim' && '-slim' || '' }}-arm64
